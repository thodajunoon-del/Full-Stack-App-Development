<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>CREATE ACCOUNT</h2>
                <p>Join us today to get started.</p>
            </div>
            
            <form id="register-form">
                <div id="message-box" class="message-box hidden"></div>
                
                <div class="input-group">
                    <label for="username">Email</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="Enter your email">
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="•••••••••">
                        <i class="fa-regular fa-eye" id="toggle-password"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm-password" placeholder="•••••••••">
                    </div>
                </div>
                
                <button type="submit" id="submit-btn" style="margin-top: 10px;">
                    <span id="btn-text">Sign up</span>
                </button>

                <div class="auth-switch">
                    Already have an account? <a href="index.html">Log in</a>
                </div>
            </form>
        </div>
    </div>
    
    <script src="register.js"></script>
</body>
</html>
