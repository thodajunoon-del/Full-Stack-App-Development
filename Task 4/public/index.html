<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h2>ORDER MANAGEMENT</h2>
            <p>Customer Order History & Statistics</p>
        </div>

        <div class="form-container">
            <h3>Create New Order</h3>
            <form id="new-order-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="customer-select" style="display: flex; justify-content: space-between;">
                            Customer 
                            <a href="#" id="add-customer-btn" style="color: var(--primary-color); text-decoration: none; font-size: 11px;">+ Add New</a>
                        </label>
                        <select id="customer-select" required>
                            <option value="">Select a customer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="product-select" style="display: flex; justify-content: space-between;">
                            Product
                            <a href="#" id="add-product-btn" style="color: var(--primary-color); text-decoration: none; font-size: 11px;">+ Add New</a>
                        </label>
                        <select id="product-select" required>
                            <option value="">Select a product</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="quantity-input">Quantity</label>
                        <input type="number" id="quantity-input" min="1" value="1" required>
                    </div>
                    <div class="form-group btn-group">
                        <button type="submit" id="create-order-btn">Place Order</button>
                    </div>
                </div>
                <div id="order-message" class="hidden"></div>
            </form>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card" id="highest-order-card">
                <h3>Highest Value Order</h3>
                <div class="value">Loading...</div>
                <div class="sub-text">Fetching data</div>
            </div>
            
            <div class="stat-card" id="active-customer-card">
                <h3>Most Active Customer</h3>
                <div class="value">Loading...</div>
                <div class="sub-text">Fetching data</div>
            </div>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer Name</th>
                        <th>Product</th>
                        <th>Qty</th>
                        <th>Total Amount</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                    <tr><td colspan="6" style="text-align: center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
