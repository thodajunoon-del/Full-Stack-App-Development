<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Manage Events')}"></head>
<body>

<div th:replace="~{layout :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-between align-center mb-2">
        <h2>Manage Events</h2>
        <a th:href="@{/admin/events/new}" class="btn btn-primary">Add New Event</a>
    </div>

    <div th:if="${param.success}" style="background: var(--success-color); color: white; padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem;">
        Event saved successfully!
    </div>
    
    <div th:if="${param.deleted}" style="background: var(--danger-color); color: white; padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem;">
        Event deleted successfully!
    </div>

    <!-- Filter Form -->
    <div class="filter-bar">
        <form th:action="@{/admin/events}" method="get" class="d-flex align-center" style="width: 100%; gap: 1rem;">
            <div>
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" class="form-control" th:value="${param.date}">
            </div>
            <div>
                <label for="department">Department:</label>
                <select id="department" name="department" class="form-control">
                    <option value="">All Departments</option>
                    <option th:each="dept : ${departments}" th:value="${dept}" th:text="${dept}" th:selected="${dept == param.department}"></option>
                </select>
            </div>
            <div>
                <label for="type">Type:</label>
                <select id="type" name="type" class="form-control">
                    <option value="">All Types</option>
                    <option th:each="t : ${types}" th:value="${t}" th:text="${t}" th:selected="${t == param.type}"></option>
                </select>
            </div>
            <div style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary">Filter</button>
                <a th:href="@{/admin/events}" class="btn" style="background: var(--border-color); color: var(--text-color);">Clear</a>
            </div>
        </form>
    </div>

    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Date</th>
                <th>Department</th>
                <th>Type</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${events.empty}">
                <td colspan="6" class="text-center">No events found.</td>
            </tr>
            <tr th:each="event : ${events}">
                <td th:text="${event.id}">1</td>
                <td th:text="${event.name}">Name</td>
                <td th:text="${event.date}">Date</td>
                <td th:text="${event.department}">Dept</td>
                <td th:text="${event.type}">Type</td>
                <td>
                    <a th:href="@{/admin/events/{id}/edit(id=${event.id})}" class="btn btn-primary" style="padding: 0.3rem 0.6rem; font-size: 0.9rem;">Edit</a>
                    <a th:href="@{/admin/events/{id}/delete(id=${event.id})}" class="btn btn-danger" style="padding: 0.3rem 0.6rem; font-size: 0.9rem;" onclick="return confirm('Are you sure you want to delete this event?');">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
    
    <div class="mt-2 text-center">
        <a th:href="@{/admin/dashboard}" class="btn" style="background: var(--secondary-color); color: white;">Back to Dashboard</a>
    </div>
</div>

</body>
</html>
