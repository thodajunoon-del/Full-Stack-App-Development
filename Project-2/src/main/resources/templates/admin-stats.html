<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Registration Stats')}"></head>
<body>

<div th:replace="~{layout :: navbar}"></div>

<div class="container">
    <h2 class="mb-2">Registration Statistics</h2>

    <div class="card mb-2 text-center" style="background: var(--primary-color); color: white;">
        <h3 style="font-size: 2rem;" th:text="${totalRegistrations}">0</h3>
        <p>Total Registrations Across All Events</p>
    </div>

    <div class="card">
        <h3 class="mb-1">Registrations per Event</h3>
        <table class="table">
            <thead>
                <tr>
                    <th>Event Name</th>
                    <th>Total Registrations</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${stats.empty}">
                    <td colspan="2" class="text-center">No registrations yet.</td>
                </tr>
                <tr th:each="stat : ${stats}">
                    <td th:text="${stat[0]}">Event Name</td>
                    <td th:text="${stat[1]}">0</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-2 text-center">
        <a th:href="@{/admin/dashboard}" class="btn" style="background: var(--secondary-color); color: white;">Back to Dashboard</a>
    </div>
</div>

</body>
</html>
