<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Admin Login')}"></head>
<body>

<div th:replace="~{layout :: navbar}"></div>

<div class="container" style="max-width: 400px; margin-top: 5rem;">
    <div class="card text-center">
        <h2 class="mb-2">Admin Login</h2>
        
        <div th:if="${param.error}" class="error-msg mb-1" style="font-size: 1rem;">
            Invalid username or password.
        </div>
        <div th:if="${param.logout}" style="color: var(--success-color); margin-bottom: 1rem;">
            You have been logged out.
        </div>

        <form th:action="@{/admin/login}" method="post">
            <div class="form-group text-left">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus>
            </div>
            <div class="form-group text-left">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
        </form>
    </div>
</div>

</body>
</html>
