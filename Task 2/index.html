<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        /* Extra styles for controls */
        .controls-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .control-item {
            flex: 1;
        }
        .control-item select {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            width: 100%;
            background: #fff;
            outline: none;
            font-size: 15px;
        }
        .control-item select:focus {
            border-color: #3563d8;
            box-shadow: 0 0 0 4px rgba(53,99,216,.15);
        }
        .dept-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .dept-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,.05);
            text-align: center;
        }
        .dept-card h3 {
            color: #3563d8;
            font-size: 30px;
            margin-bottom: 5px;
        }
        .dept-card p {
            color: #6b7280;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="dashboard">

    <!-- ================= Sidebar ================= -->
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">
                🎓
            </div>
            <div class="logo-text">
                <h2>Student</h2>
                <p>Management System</p>
            </div>
        </div>

        <ul class="menu">
            <li class="active">
                <i class="fa-solid fa-chart-line"></i>
                Dashboard
            </li>
        </ul>
    </aside>

    <!-- ================= Main Content ================= -->
    <main class="main-content">
        <div class="topbar">
            <h1>Data Retrieval & Sorting Dashboard</h1>
            <p>View, filter, and sort student records</p>
        </div>

        <!-- Dashboard Section -->
        <section class="content-section">
            
            <!-- Overall Stats -->
            <div class="cards">
                <div class="card">
                    <h2>Total Students</h2>
                    <p id="totalStudents">0</p>
                </div>
            </div>

            <!-- Controls (Filter and Sort) -->
            <div class="table-card" style="margin-top: 25px;">
                <h2 style="margin-bottom: 15px;">Controls</h2>
                <div class="controls-section">
                    <div class="control-item">
                        <select id="filter-dept">
                            <option value="All">All Departments</option>
                        </select>
                    </div>
                    <div class="control-item">
                        <select id="sort-by">
                            <option value="name-asc">Sort by Name (A-Z)</option>
                            <option value="name-desc">Sort by Name (Z-A)</option>
                            <option value="date-asc">Sort by DOB (Oldest)</option>
                            <option value="date-desc">Sort by DOB (Youngest)</option>
                        </select>
                    </div>
                </div>

                <!-- Department Counts displayed dynamically here -->
                <div id="dept-counts-container" class="dept-cards">
                    <!-- Javascript will populate this -->
                </div>
            </div>

            <!-- Data Table -->
            <div class="table-card">
                <h2>Student Records</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>DOB</th>
                                <th>Department</th>
                                <th>Phone</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td colspan="6">Loading data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
