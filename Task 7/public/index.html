<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback Form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container" style="max-width: 600px;">
        <div class="dashboard-header">
            <h2>CUSTOMER FEEDBACK</h2>
            <p>Department of Computer Science and Engineering</p>
            <p style="font-size: 13px; margin-top: 4px; font-weight: 600; color: #94a3b8;">VTR UGE - 2021 – B.Tech - CSE</p>
        </div>

        <div class="form-container" style="margin-bottom: 24px;">
            <h3 style="display: flex; justify-content: space-between; align-items: center;">
                <span style="display:flex; align-items: center; gap: 8px;"><i class="fa-solid fa-comment-dots"></i> Submit Your Feedback</span>
            </h3>
            <form id="feedback-form">
                
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="fb-name">Full Name</label>
                    <div style="position: relative;">
                        <input type="text" id="fb-name" placeholder="John Doe" required style="width: 100%;">
                        <i id="name-icon" class="fa-solid fa-check hidden" style="position: absolute; right: 12px; top: 14px; color: #10b981;"></i>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="fb-email">Email Address</label>
                    <div style="position: relative;">
                        <input type="email" id="fb-email" placeholder="john@example.com" required style="width: 100%;">
                        <i id="email-icon" class="fa-solid fa-check hidden" style="position: absolute; right: 12px; top: 14px; color: #10b981;"></i>
                        <p id="email-error" style="color: #ef4444; font-size: 11px; margin-top: 4px; display: none;">Invalid email format</p>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="fb-rating">Rating (1-5)</label>
                    <input type="number" id="fb-rating" min="1" max="5" placeholder="5" required style="width: 100%;">
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label for="fb-comments">Comments</label>
                    <textarea id="fb-comments" rows="4" placeholder="Your feedback..." required style="width: 100%; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 16px; font-family: inherit; font-size: 14px; outline: none; background: var(--input-bg); transition: all 0.2s ease; resize: vertical;"></textarea>
                </div>

                <div class="form-group btn-group" style="width: 100%;">
                    <button type="button" id="submit-btn" style="background: var(--primary-color); display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease; width: 100%;">
                        <i class="fa-solid fa-paper-plane"></i> Double-Click to Submit
                    </button>
                </div>
            </form>
            
            <!-- Success Modal / Message -->
            <div id="success-message" class="hidden" style="margin-top: 20px; padding: 16px; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 8px; text-align: center;">
                <i class="fa-solid fa-circle-check" style="color: #10b981; font-size: 24px; margin-bottom: 8px;"></i>
                <h4 style="color: #065f46;">Feedback Submitted!</h4>
                <p style="font-size: 13px; color: #047857; margin-top: 4px;">Thank you for your response.</p>
            </div>
        </div>

        <div class="table-container" style="background: var(--bg-card); padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow-x: auto;">
            <h3 style="font-size: 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-clock-rotate-left" style="color: var(--primary-color);"></i> Recent Feedback
            </h3>
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr>
                        <th style="background: var(--input-bg); padding: 12px; text-align: left; font-size: 13px; color: var(--text-secondary); border-bottom: 1px solid var(--border-color);">Name</th>
                        <th style="background: var(--input-bg); padding: 12px; text-align: left; font-size: 13px; color: var(--text-secondary); border-bottom: 1px solid var(--border-color);">Rating</th>
                        <th style="background: var(--input-bg); padding: 12px; text-align: left; font-size: 13px; color: var(--text-secondary); border-bottom: 1px solid var(--border-color);">Comments</th>
                    </tr>
                </thead>
                <tbody id="feedback-table-body">
                    <tr><td colspan="3" style="text-align: center; padding: 12px;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
